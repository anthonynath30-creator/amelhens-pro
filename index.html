<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Canopée</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#123524">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f5f0;--sf:#fff;--tx:#14221a;--mu:#5f6f64;--ac:#1f6b45;--ac2:#e3efe7;--bd:#d6dfd8;--am:#c98a1b;--rd:#b3402a;--sh:0 1px 3px #0001,0 4px 14px #0000000d}
@media(prefers-color-scheme:dark){:root{--bg:#0d1511;--sf:#16211a;--tx:#e6efe8;--mu:#93a599;--ac:#6fcf9a;--ac2:#1d3326;--bd:#27382d;--am:#e0a43a;--rd:#e58a76;--sh:none}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding-bottom:150px}
header{background:linear-gradient(135deg,#0f3a25,#1f6b45);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;border-radius:0 0 22px 22px}
h1{margin:0;font-size:22px;letter-spacing:.3px}h3{margin:18px 0 6px}small,.mu{color:var(--mu);font-size:13px}header small{color:#cfe8d8}
main{padding:10px 14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:13px;margin:10px 0;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh)}.tile b{font-size:26px;display:block;color:var(--ac)}
button{font:inherit;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}@media(prefers-color-scheme:dark){button.p{color:#0d1511}}
button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:700}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:8px 10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:60px;font-size:11px;padding:0}nav button.on{color:var(--ac);background:var(--ac2)}
#fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;min-height:58px;border-radius:29px;font-size:28px;padding:0;z-index:6;box-shadow:0 4px 14px #0005}
#sh{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}#sh.on{display:flex}
#sc{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:var(--ac2);color:var(--ac);margin:1px}.tag.r{background:#b3402a22;color:var(--rd)}.tag.a{background:#c98a1b22;color:var(--am)}
img.ph{max-width:100%;border-radius:12px;margin:6px 0}svg{width:100%;background:var(--ac2);border-radius:16px}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.cal{display:grid;grid-template-columns:110px repeat(12,1fr);gap:2px;font-size:11px;align-items:center;margin:2px 0}.cal i{height:16px;border-radius:3px;background:var(--bd)}.cal i.y{background:var(--ac)}
.ms{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.ms label{display:flex;gap:3px;align-items:center;font-size:13px}.ms input{width:auto;min-height:0;margin:0}
.tile{position:relative}.pl{position:absolute;top:8px;right:8px;min-height:34px;width:34px;padding:0;border-radius:17px;background:var(--ac2);color:var(--ac);border:0;font-size:20px}.x{min-height:34px;padding:0 10px;float:right;color:var(--rd)}.lt{background:#000a;color:#fff;border:0;box-shadow:none;font-size:11px;padding:1px 5px}#sg div{padding:10px;border:1px solid var(--bd);border-radius:10px;margin:3px 0;background:var(--sf)}.sec summary{padding:10px 0;font-weight:700;color:var(--ac);cursor:pointer}details.card summary{cursor:pointer;min-height:36px}.cal i.l{background:var(--am)}.cal i.o{background:#c0602a}</style></head><body>
<header><div class="row"><div class="sp"><h1>🌿 Canopée</h1><small>Acclimatation · forêt nourricière · terrain</small></div><span id="net" class="tag"></span></div></header>
<main id="m"></main><button id="fab" class="p" onclick="plantForm()" aria-label="Nouvel arbre">＋</button><nav id="nv"></nav>
<div id="sh" onclick="if(event.target===this)cl()"><div id="sc"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const REF={lat:44.181224,lng:4.031918},YR=31557600000,DAY=864e5;
const ZONES=["Plein sud chaud","Sec / faible réserve","Argileux humide l’hiver","Humidité durable","Abrité du vent","Exposé au vent","Risque de gel","Cuvette / poche froide","Ombre partielle","Protégé par végétation","Non définie"];
const OTYPES=["Observation","Mesure","Arrosage","Taille / entretien","Sanitaire","Floraison / fruits","Gel / canicule","Mortalité","Identification (hypothèse)"];
const STAT=["À documenter","Documenté","Estimé","Hypothèse","Observation personnelle"];
const STR=["Grands arbres","Arbres fruitiers","Petits arbres","Arbustes fruitiers","Herbacées","Couvre-sols","Plantes racinaires","Grimpantes","Champignons / mycorhizes"];
const MO="J F M A M J J A S O N D".split(" ");
const QU="pyrenaica,alba,dentata,ithaburensis subsp. macrolepis,coccifera,stellata,libani,muehlenbergii,canariensis,calliprinos,fusiformis,arizonica,frainetto,acutissima,trojana,cerris,pubescens,faginea,canbyi,glaucoides,airensis,buckleyi,franchetii,aucheri,salicina,shumardii,macrocarpa,prinoides,suber,agrifolia,douglasii,brantii".split(",");
const OT=[["Ficus carica","Moraceae"],["Ceratonia siliqua","Fabaceae"],["Pistacia spp.","Anacardiaceae"],["Sapindus mukorossi","Sapindaceae"],["Opuntia spp.","Cactaceae"],["Argania spinosa","Sapotaceae"],["Brachychiton populneus","Malvaceae"],["Quillaja saponaria","Quillajaceae"],["Maytenus boaria","Celastraceae"],["Chilopsis linearis","Bignoniaceae"],["Peumus boldus","Monimiaceae"],["Aesculus californica","Sapindaceae"]];
let S,tab="home",sub="jr",vs="cat",cat="all",Q="",ZF="",PH=null,IDR=[],IDI=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),fd=t=>new Date(t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
const sp=id=>S.species.find(s=>s.id===id)||{},pObs=id=>S.obs.filter(o=>o.plantId===id).sort((a,b)=>b.ts-a.ts),dead=p=>pObs(p.id).some(o=>o.type==="Mortalité"),yrs=p=>p.date?(Date.now()-new Date(p.date))/YR:0;
function mkCode(sci){const p=sci.split(" ");let c=(p[0][0]+(p[1]||"xx").slice(0,2)).toUpperCase(),b=c,n=1;while(S.species.some(s=>s.code===c))c=b+(n++);return c}
function addSp(sci,fam){S.species.push({id:uid(),sci,code:mkCode(sci),fam,fr:"",status:"À documenter",source:"",drought:"",frost:"",invasive:false,notes:"",strate:"",mois:"",food:false})}
function seed(){S={species:[],plants:[],obs:[],rec:[],assoc:[],meta:{}};QU.forEach(e=>addSp("Quercus "+e,"Fagaceae"));OT.forEach(o=>addSp(o[0],o[1]))}
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open("amelhens-pro",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function load(){try{const d=await idb();return await new Promise(r=>{const g=d.transaction("k").objectStore("k").get("s");g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)})}catch(e){return null}}
async function save(){try{const d=await idb();d.transaction("k","readwrite").objectStore("k").put(S,"s")}catch(e){$("#net").textContent="⚠ stockage"}}

const T=t=>{tab=t;draw()};
function rz(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))};im.src=URL.createObjectURL(f)})}

const phIn=`<label>Photo</label><input type="file" accept="image/*" capture="environment" onchange="photo(this)"><div class="mu"></div><div class="mu"></div>`;
function gps(a,b){const x=event.target;x.textContent="Recherche GPS…";navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{$(a).value=p.coords.latitude.toFixed(6);$(b).value=p.coords.longitude.toFixed(6);x.textContent="📍 Position enregistrée"},()=>x.textContent="GPS indisponible",{enableHighAccuracy:true,timeout:20000}):x.textContent="GPS indisponible"}
function mic(id){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert("Dictée non disponible");return}const r=new R();r.lang="fr-FR";r.onresult=e=>{$(id).value+=(" "+e.results[0][0].transcript).trim()+" "};r.start()}
function growth(p){const o=S.obs.filter(x=>x.plantId===p.id&&x.h).sort((a,b)=>a.ts-b.ts);if(o.length<2)return null;const dt=o[o.length-1].ts-o[0].ts;return dt<60*DAY?null:(o[o.length-1].h-o[0].h)/(dt/YR)}
function stats(s){const P=S.plants.filter(p=>p.sp===s.id);if(!P.length)return null;const v=P.filter(p=>!dead(p)).length,my=Math.max(...P.map(yrs)),g=P.map(growth).filter(x=>x!=null),gm=g.length?g.reduce((a,b)=>a+b)/g.length:null,st=S.obs.filter(o=>o.type==="Gel / canicule"&&P.some(p=>p.id===o.plantId)).length;let lv=0;if(P.length>=3&&my>=1)lv=1;if(P.length>=3&&my>=3)lv=2;if(P.length>=5&&my>=5)lv=3;return{n:P.length,v,surv:v/P.length,my,gm,st,lv,lab:["Insuffisant","Préliminaire","Indicatif","Solide"][lv],idx:lv?Math.round(v/P.length*100*[0,.5,.75,1][lv]):null}}
function draw(){navPush();$("#nv").innerHTML=[["home","🏠","Accueil"],["map","🗺️","Terrain"],["pl","🌱","Végétaux"],["ac","🧪","Acclim."],["fo","🌳","Forêt"],["mo","☰","Plus"]].map(t=>`<button class="${tab===t[0]?"on":""}" onclick="T('${t[0]}')">${t[1]}<br>${t[2]}</button>`).join("");$("#m").innerHTML={home:vHome,map:vMap,pl:vPl,ac:vAc,fo:vFo,mo:vMo}[tab]();window.scrollTo(0,0);if(tab==="map")initMap()}
function vHome(){const P=S.plants,V=P.filter(p=>!dead(p)),ph=S.obs.filter(o=>o.img).length+P.filter(p=>p.img).length,kg=S.rec.reduce((a,r)=>a+(+r.kg||0),0),al=[];
P.forEach(p=>{if(dead(p))return;const o=pObs(p.id)[0],l=o?o.ts:new Date(p.date||0).getTime();if(Date.now()-l>60*DAY)al.push(p.id+" : aucune observation depuis plus de 60 jours");if(!p.lat)al.push(p.id+" : position GPS manquante")});
if(!S.meta.exp||Date.now()-S.meta.exp>14*DAY)al.unshift("Sauvegarde conseillée : Plus → Données → Télécharger");const tdy=new Date().toISOString().slice(0,10),mo=String(new Date().getMonth()+1),yr=new Date().getFullYear();S.species.forEach(s=>{const n=S.plants.filter(q=>q.sp===s.id&&!dead(q));if(!n.length)return;if((s.moisT||"").split(",").includes(mo)){const k=n.filter(q=>!pObs(q.id).some(o=>o.type==="Taille / entretien"&&new Date(o.ts).getMonth()+1==mo&&new Date(o.ts).getFullYear()===yr)).length;if(k)al.push("✂ Taille ce mois-ci : "+s.sci+" ("+k+" arbre(s))")}if(["mois","moisF","moisA"].some(f=>(s[f]||"").split(",").includes(mo)))al.push("🧺 Récolte possible ce mois-ci : "+s.sci)});S.tasks.filter(k=>k.d&&k.d<tdy).forEach(k=>al.unshift("En retard : "+k.t));if(S.meta.wx&&Math.min(...S.meta.wx.d.temperature_2m_min.slice(7))<=0)al.unshift("Gel annoncé dans les 7 jours : protégez les jeunes plants");
const t=(n,l,a,b)=>`<div class="tile" onclick="${a}">${b?`<button class="pl" onclick="event.stopPropagation();${b}">＋</button>`:""}<b>${n}</b>${l}</div>`;
return `<div class="grid">${t(S.species.length,"espèces au catalogue","tab='pl';vs='cat';draw()","spForm()")}${t(P.length,"individus plantés","tab='pl';vs='ind';draw()","plantForm()")}${t(V.length,"vivants","tab='pl';vs='ind';draw()","")}${t(P.length?Math.round(V.length/P.length*100)+" %":"—","survie globale","T('ac')","")}${t(S.obs.length,"observations","tab='mo';sub='jr';draw()","obsForm()")}${t(ph,"photos","tab='mo';sub='jr';draw()","obsForm()")}${t(kg.toFixed(1)+" kg","récoltés","T('fo')","recForm()")}${t(S.assoc.length,"associations notées","T('fo')","assForm()")}</div>
<div class="row" style="margin-top:12px"><button class="p sp" onclick="plantForm()">🌱 Nouvel arbre</button><button class="sp" onclick="tab='mo';sub='id';draw()">📷 Identifier</button><button class="sp" onclick="diagForm()">🩺 Santé</button></div>
${wxCard()}${taskCard()}<h3>À surveiller</h3>${al.length?al.slice(0,8).map(a=>`<div class="card">⚠ ${esc(a)}</div>`).join(""):'<div class="card mu">Rien à signaler.</div>'}
<div class="card"><small>Les données restent sur ce téléphone. Aucune donnée n’est inventée : les résultats d’acclimatation n’apparaissent qu’à partir de vos propres observations.</small></div>`}
function vSvg(){const pts=S.plants.filter(p=>p.lat&&p.lng&&(!ZF||p.zone===ZF)),k=Math.cos(REF.lat*Math.PI/180);let la=[REF.lat],lo=[REF.lng];pts.forEach(p=>{la.push(+p.lat);lo.push(+p.lng)});
const a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo),sc=300/Math.max(b-a,(d-c)*k,.0004),X=g=>30+(g-c)*k*sc,Y=g=>330-(g-a)*sc;
const dots=pts.map(p=>`<g onclick="plantSheet('${p.id}')"><circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="11" fill="${dead(p)?"#b3402a":"#1f6b45"}" stroke="#fff" stroke-width="2"/><text x="${X(p.lng)+14}" y="${Y(p.lat)+4}" font-size="11" fill="currentColor">${esc(p.id.replace("AM-",""))}</text></g>`).join("");
return `<select onchange="ZF=this.value;draw()"><option value="">Toutes les zones</option>${ZONES.map(z=>`<option ${z===ZF?"selected":""}>${z}</option>`).join("")}</select>
<div class="card"><b>Plan du terrain</b><br><small>Placé d’après le GPS, nord en haut. Fond satellite non inclus (non disponible hors ligne). + = point de repérage cadastral E-159.</small><svg viewBox="0 0 360 360"><text x="335" y="22" font-size="14" fill="currentColor">N↑</text><path d="M${X(REF.lng)-8} ${Y(REF.lat)}h16M${X(REF.lng)} ${Y(REF.lat)-8}v16" stroke="currentColor" stroke-width="2"/>${dots}</svg><div class="mu">${pts.length} plant(s) · vert = vivant, rouge = mort</div></div>`}
function listSp(){const q=Q.toLowerCase(),L=S.species.filter(s=>(s.sci+s.fr).toLowerCase().includes(q)&&fc(s));
return L.map(s=>{const t=stats(s);return `<div class="card" onclick="spForm('${s.id}')"><button class="x" onclick="event.stopPropagation();delSp('${s.id}')">🗑</button><b><i>${esc(s.sci)}</i></b> <span class="tag">${esc(s.code)}</span>${s.invasive?' <span class="tag r">invasive</span>':""}${s.food?' <span class="tag a">alimentaire</span>':""}${(s.use||[]).filter(u=>!u.startsWith("Comestible")).slice(0,2).map(u=>` <span class="tag">${esc(u)}</span>`).join("")}<br><small>${esc(s.fam)} · ${esc(s.strate||"strate ?")} · ${S.plants.filter(p=>p.sp===s.id).length} individu(s)${t?" · survie "+Math.round(t.surv*100)+" %":""}</small></div>`}).join("")||'<p class="mu">Aucun résultat.</p>'}
function vMap(){return `<div class="row"><select class="sp" id="bs" onchange="setBase(this.value)"><option value="sat">🛰️ Satellite IGN</option><option value="esri">🛰️ Satellite Esri</option><option value="plan">🗺️ Plan</option></select><select class="sp" onchange="ZF=this.value;draw()"><option value="">Toutes zones</option>${ZONES.map(z=>`<option ${z===ZF?"selected":""}>${z}</option>`).join("")}</select></div><div class="row" style="margin-bottom:8px"><button class="p sp" onclick="locate()">📍 Ma position</button><button class="sp" onclick="fitAll()">⛶ Tout voir</button><label class="sp"><input type="checkbox" style="width:auto;min-height:0" onchange="cad(this.checked)"> Cadastre</label></div><div id="map" style="height:58vh;border-radius:16px;overflow:hidden"></div><small class="mu">Touchez la carte pour planter à cet endroit. Fonds : Internet requis ; les zones déjà consultées restent visibles hors ligne.</small>`}
function vPl(){const sg=(v,l)=>`<button class="sp ${vs===v?"on":""}" onclick="vs='${v}';draw()">${l}</button>`;
if(vs==="ind")return `<div class="row">${sg("cat","Catalogue")}${sg("ind","Individus")}</div><button class="p" style="width:100%;margin-top:8px" onclick="plantForm()">＋ Planter</button><div class="row" style="margin:8px 0"><select id="xf" class="sp"><option value="ods">ODS (LibreOffice)</option><option value="xlsx">Excel (XLSX)</option><option value="csv">CSV</option></select><button class="sp" onclick="xport('pl')">⬇ Exporter les individus</button></div>`+(S.plants.map(p=>`<div class="card" onclick="plantSheet('${p.id}')"><button class="x" onclick="event.stopPropagation();delPlant('${p.id}')">🗑</button><b>${esc(p.id)}</b> ${dead(p)?'<span class="tag r">mort</span>':'<span class="tag">vivant</span>'}<br><i>${esc(sp(p.sp).sci)}</i><br><small>${esc(p.zone)} · planté le ${esc(p.date||"?")}</small></div>`).join("")||'<p class="mu">Aucun individu.</p>');
const ct=(v,l)=>`<button class="${cat===v?"on":""}" onclick="cat='${v}';draw()">${l}</button>`;
return `<div class="row">${sg("cat","Catalogue")}${sg("ind","Individus")}</div><input placeholder="🔎 Rechercher…" value="${esc(Q)}" oninput="Q=this.value;$('#ls').innerHTML=listSp()"><div class="row">${ct("all","Tout")}${ct("Q","Quercus")}${ct("F","Alimentaires")}${ct("A","Aromatiques")}${ct("M","Médicinales")}<button class="p sp" onclick="spForm()">＋ Espèce</button></div><div class="row" style="margin:8px 0"><select id="xf" class="sp"><option value="ods">ODS (LibreOffice)</option><option value="xlsx">Excel (XLSX)</option><option value="csv">CSV</option></select><button class="sp" onclick="xport('sp')">⬇ Exporter la liste affichée</button></div><div id="ls">${listSp()}</div>`}
function vAc(){const rows=S.species.map(s=>[s,stats(s)]).filter(x=>x[1]),zs=[...new Set(S.plants.map(p=>p.zone))];
return `<div class="card"><small><b>Comment lire cette page.</b> Survie = individus vivants / plantés. Confiance : <i>Insuffisant</i> (moins de 3 plants ou moins d’1 an), <i>Préliminaire</i> (≥3 plants, ≥1 an), <i>Indicatif</i> (≥3 ans), <i>Solide</i> (≥5 plants et ≥5 ans). Indice = survie × palier de confiance, affiché seulement dès « Préliminaire ». Une différence entre espèces n’est pas une preuve statistique avec si peu de plants.</small></div>`+
(rows.map(([s,t])=>`<div class="card"><b><i>${esc(s.sci)}</i></b> <span class="tag ${t.lv<2?"a":""}">${t.lab}</span><div class="bar" style="margin:8px 0"><i style="width:${t.surv*100}%"></i></div><small>${t.v}/${t.n} vivants (${Math.round(t.surv*100)} %) · suivi ${t.my.toFixed(1)} an(s)<br>Croissance : ${t.gm==null?"pas assez de mesures":t.gm.toFixed(1)+" cm/an"} · épisodes gel/canicule notés : ${t.st}<br><b>Indice d’acclimatation : ${t.idx==null?"non calculable":t.idx+" / 100"}</b></small></div>`).join("")||'<p class="mu">Plantez des arbres et notez des observations : les résultats apparaîtront ici.</p>')+
(zs.length?`<h3>Par zone</h3>`+zs.map(z=>{const P=S.plants.filter(p=>p.zone===z),v=P.filter(p=>!dead(p)).length;return `<div class="card"><b>${esc(z)}</b><div class="bar" style="margin:6px 0"><i style="width:${v/P.length*100}%"></i></div><small>${v}/${P.length} vivants</small></div>`}).join(""):"")}

function diagSave(i){const t=symT().map(x=>SYM.find(s=>s[0]===x)[1]);S.obs.push({id:uid(),ts:Date.now(),plantId:$("#dg1").value,type:"Sanitaire",text:"Diagnostic (hypothèse) : "+DG[i]+". Symptômes : "+t.join(", "),h:"",d:"",lat:"",lng:"",img:PH||""});save();alert("Enregistré dans le journal et sur la fiche de l’arbre.")}
async function diagShare(){const t=symT().map(x=>SYM.find(s=>s[0]===x)[1]),pl=S.plants.find(p=>p.id===$("#dg1").value),txt="Aide-moi à identifier ce problème sur mon arbre"+(pl?" ("+sp(pl.sp).sci+")":"")+". Symptômes : "+t.join(", ")+". Propose des solutions bio.";try{const o={text:txt};if(PH){const b=await(await fetch(PH)).blob();o.files=[new File([b],"photo.jpg",{type:"image/jpeg"})];if(!(navigator.canShare&&navigator.canShare(o)))delete o.files}await navigator.share(o)}catch(e){try{await navigator.clipboard.writeText(txt);alert("Texte copié : collez-le dans l’application de votre choix.")}catch(_){}}}
function spInfo(s,p){const lt=pObs(p.id).find(o=>o.type==="Taille / entretien"),R=[["Fruits / graines",s.mois],["Feuilles",s.moisF],["Autres",s.moisA]].filter(x=>x[1]).map(x=>x[0]+" : "+mn(x[1])).join(" · ");return `<div class="card"><small>${(s.use||[]).map(u=>`<span class="tag a">${esc(u.replace("Comestible : ","🍽 "))}</span>`).join("")||"Utilisations non renseignées"}<br>${R?"🧺 Récolte — "+esc(R)+"<br>":""}${s.moisT?"✂ Taille conseillée : "+esc(mn(s.moisT))+(s.tNote?" ("+esc(s.tNote)+")":"")+"<br>":""}${lt?"Dernier entretien : "+fd(lt.ts)+"<br>":""}${s.usages?esc(s.usages)+"<br>":""}${s.prec?"⚠ "+esc(s.prec):""}</small><br><button onclick="cl();spForm('${s.id}')">Modifier la fiche espèce</button></div>`}
function spForm(id){const s=Object.assign({sci:"",fam:"",fr:"",status:"À documenter",source:"",drought:"",frost:"",notes:"",invasive:false,strate:"",mois:"",moisF:"",moisA:"",moisT:"",tNote:"",use:[],usages:"",prec:"",haut:"",food:false},id?sp(id):{}),sel=(n,v)=>`<select id="${n}"><option value="">non évalué</option>${[0,1,2,3,4,5].map(i=>`<option ${String(v)===String(i)?"selected":""}>${i}</option>`).join("")}</select>`,mc=(c,v)=>`<div class="ms">${MO.map((x,i)=>`<label><input type="checkbox" class="${c}" value="${i+1}" ${(v||"").split(",").includes(String(i+1))?"checked":""}>${x}</label>`).join("")}</div><p></p>`;
openS(`<h3>${id?"Fiche espèce":"Nouvelle espèce"}</h3><details class="sec" open><summary>Identité</summary><label>Nom scientifique (3 lettres : suggestions)</label><input id="f1" value="${esc(s.sci)}" oninput="sugg(this.value)"><div id="sg"></div><label>Nom français</label><input id="f2" value="${esc(s.fr)}"><label>Famille</label><input id="f3" value="${esc(s.fam)}"><label>Strate de la forêt nourricière</label><select id="fs"><option value="">—</option>${STR.map(x=>`<option ${x===s.strate?"selected":""}>${x}</option>`).join("")}</select><label>Hauteur adulte (m)</label><input id="fh" value="${esc(s.haut)}" inputmode="decimal"></details>
<details class="sec"><summary>Utilisations</summary><div class="ms" style="grid-template-columns:1fr 1fr">${USES.map((u,i)=>`<label><input type="checkbox" class="uu" value="${i}" ${(s.use||[]).includes(u)?"checked":""}>${u}</label>`).join("")}</div><p></p><label>Usages détaillés (ex. glands doux après lessivage, feuilles en tisane…)</label><textarea id="fu" rows="3">${esc(s.usages)}</textarea><label>Précautions (toxicité, préparation)</label><textarea id="fp" rows="2">${esc(s.prec)}</textarea><small class="mu">Ne consommez jamais une plante sans avoir vérifié l’espèce et sa préparation auprès d’une source fiable.</small></details>
<details class="sec"><summary>Calendrier : récoltes et taille</summary><label>Récolte des fruits / graines</label>${mc("mm",s.mois)}<label>Récolte des feuilles</label>${mc("mf",s.moisF)}<label>Autres récoltes (fleurs, racines, écorce…)</label>${mc("ma",s.moisA)}<label>Période de taille</label>${mc("mt",s.moisT)}<label>Note de taille (formation, entretien…)</label><input id="ft" value="${esc(s.tNote)}"></details>
<details class="sec"><summary>Écologie et sources</summary><label>Résistance sécheresse (0-5)</label>${sel("f4",s.drought)}<label>Résistance gel (0-5)</label>${sel("f5",s.frost)}<label>Statut de la donnée</label><select id="f6">${STAT.map(x=>`<option ${x===s.status?"selected":""}>${x}</option>`).join("")}</select><label>Source</label><input id="f7" value="${esc(s.source)}"><label>Notes</label><textarea id="f8" rows="3">${esc(s.notes)}</textarea><label><input type="checkbox" id="f9" style="width:auto;min-height:0" ${s.invasive?"checked":""}> Risque invasif avéré</label></details>
<div class="row" style="margin-top:10px"><button class="p sp" onclick="spSave('${id||""}')">Enregistrer</button>${id?`<button onclick="cl();plantForm('${id}')">🌱 Planter</button><button class="d" onclick="delSp('${id}')">🗑</button>`:""}<button onclick="cl()">Annuler</button></div>`)}
function spSave(id){const v=n=>$("#"+n).value.trim(),mv=c=>[...document.querySelectorAll("."+c+":checked")].map(x=>x.value).join(",");if(!v("f1")){alert("Nom requis");return}let s=id?sp(id):null;if(!s){s={id:uid(),code:mkCode(v("f1"))};S.species.push(s)}const use=[...document.querySelectorAll(".uu:checked")].map(x=>USES[+x.value]);
Object.assign(s,{sci:v("f1"),fr:v("f2"),fam:v("f3"),strate:v("fs"),haut:v("fh"),use,food:use.some(u=>u.startsWith("Comestible")),usages:v("fu"),prec:v("fp"),mois:mv("mm"),moisF:mv("mf"),moisA:mv("ma"),moisT:mv("mt"),tNote:v("ft"),drought:v("f4"),frost:v("f5"),status:v("f6"),source:v("f7"),notes:v("f8"),invasive:$("#f9").checked});save();cl();draw()}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{S=await load();if(!S)seed();S.rec=S.rec||[];S.tasks=S.tasks||[];S.assoc=S.assoc||[];S.meta=S.meta||{};if(!S.species.length)seed();save();draw();if(navigator.onLine&&(!S.meta.wx||Date.now()-S.meta.wx.t>3*36e5))wx()})();
</script></body></html>
