</style></head><body>
<header><div class="row"><div class="sp"><h1>🌳 Amelhens</h1><small>Acclimatation · forêt nourricière · terrain</small></div><span id="net" class="tag"></span></div></header>
<main id="m"></main><button id="fab" class="p" onclick="obsForm()" aria-label="Observation">＋</button><nav id="nv"></nav>
<div id="sh" onclick="if(event.target===this)cl()"><div id="sc"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const REF={lat:44.181224,lng:4.031918},YR=31557600000,DAY=864e5;
const ZONES=["Plein sud chaud","Sec / faible réserve","Argileux humide l’hiver","Humidité durable","Abrité du vent","Exposé au vent","Risque de gel","Cuvette / poche froide","Ombre partielle","Protégé par végétation","Non définie"];
const OTYPES=["Observation","Mesure","Arrosage","Taille / entretien","Sanitaire","Floraison / fruits","Gel / canicule","Mortalité","Identification (hypothèse)"];
const STAT=["À documenter","Documenté","Estimé","Hypothèse","Observation personnelle"];
const STR=["Grands arbres","Arbres fruitiers","Petits arbres","Arbustes fruitiers","Herbacées","Couvre-sols","Plantes racinaires","Grimpantes","Champignons / mycorhizes"];
const MO="J F M A M J J A S O N D".split(" ");
const QU="pyrenaica,alba,dentata,ithaburensis subsp. macrolepis,coccifera,stellata,libani,muehlenbergii,canariensis,calliprinos,fusiformis,arizonica,frainetto,acutissima,trojana,cerris,pubescens,faginea,canbyi,glaucoides,airensis,buckleyi,franchetii,aucheri,salicina,shumardii,macrocarpa,prinoides,suber,agrifolia,douglasii,brantii".split(",");
const OT=[["Ficus carica","Moraceae"],["Ceratonia siliqua","Fabaceae"],["Pistacia spp.","Anacardiaceae"],["Sapindus mukorossi","Sapindaceae"],["Opuntia spp.","Cactaceae"],["Argania spinosa","Sapotaceae"],["Brachychiton populneus","Malvaceae"],["Quillaja saponaria","Quillajaceae"],["Maytenus boaria","Celastraceae"],["Chilopsis linearis","Bignoniaceae"],["Peumus boldus","Monimiaceae"],["Aesculus californica","Sapindaceae"]];
let S,tab="home",sub="jr",vs="cat",cat="all",Q="",ZF="",PH=null,IDR=[],IDI=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),fd=t=>new Date(t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
const sp=id=>S.species.find(s=>s.id===id)||{},pObs=id=>S.obs.filter(o=>o.plantId===id).sort((a,b)=>b.ts-a.ts),dead=p=>pObs(p.id).some(o=>o.type==="Mortalité"),yrs=p=>p.date?(Date.now()-new Date(p.date))/YR:0;
function mkCode(sci){const p=sci.split(" ");let c=(p[0][0]+(p[1]||"xx").slice(0,2)).toUpperCase(),b=c,n=1;while(S.species.some(s=>s.code===c))c=b+(n++);return c}
function addSp(sci,fam){S.species.push({id:uid(),sci,code:mkCode(sci),fam,fr:"",status:"À documenter",source:"",drought:"",frost:"",invasive:false,notes:"",strate:"",mois:"",food:false})}
function seed(){S={species:[],plants:[],obs:[],rec:[],assoc:[],meta:{}};QU.forEach(e=>addSp("Quercus "+e,"Fagaceae"));OT.forEach(o=>addSp(o[0],o[1]))}
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open("amelhens-pro",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function load(){try{const d=await idb();return await new Promise(r=>{const g=d.transaction("k").objectStore("k").get("s");g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)})}catch(e){return null}}
async function save(){try{const d=await idb();d.transaction("k","readwrite").objectStore("k").put(S,"s")}catch(e){$("#net").textContent="⚠ stockage"}}
function openS(h){$("#sc").innerHTML=h;$("#sh").classList.add("on")}function cl(){$("#sh").classList.remove("on")}
const T=t=>{tab=t;draw()};
function rz(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))};im.src=URL.createObjectURL(f)})}
async function photo(i){const f=i.files[0];if(!f)return;PH=await rz(f);i.nextElementSibling.textContent="✔ Photo prête"}
const phIn=`<label>Photo</label><input type="file" accept="image/*" capture="environment" onchange="photo(this)"><div class="mu"></div>`;
function gps(a,b){const x=event.target;x.textContent="Recherche GPS…";navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{$(a).value=p.coords.latitude.toFixed(6);$(b).value=p.coords.longitude.toFixed(6);x.textContent="📍 Position enregistrée"},()=>x.textContent="GPS indisponible",{enableHighAccuracy:true,timeout:20000}):x.textContent="GPS indisponible"}
function mic(id){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert("Dictée non disponible");return}const r=new R();r.lang="fr-FR";r.onresult=e=>{$(id).value+=(" "+e.results[0][0].transcript).trim()+" "};r.start()}
function growth(p){const o=S.obs.filter(x=>x.plantId===p.id&&x.h).sort((a,b)=>a.ts-b.ts);if(o.length<2)return null;const dt=o[o.length-1].ts-o[0].ts;return dt<60*DAY?null:(o[o.length-1].h-o[0].h)/(dt/YR)}
function stats(s){const P=S.plants.filter(p=>p.sp===s.id);if(!P.length)return null;const v=P.filter(p=>!dead(p)).length,my=Math.max(...P.map(yrs)),g=P.map(growth).filter(x=>x!=null),gm=g.length?g.reduce((a,b)=>a+b)/g.length:null,st=S.obs.filter(o=>o.type==="Gel / canicule"&&P.some(p=>p.id===o.plantId)).length;let lv=0;if(P.length>=3&&my>=1)lv=1;if(P.length>=3&&my>=3)lv=2;if(P.length>=5&&my>=5)lv=3;return{n:P.length,v,surv:v/P.length,my,gm,st,lv,lab:["Insuffisant","Préliminaire","Indicatif","Solide"][lv],idx:lv?Math.round(v/P.length*100*[0,.5,.75,1][lv]):null}}
function draw(){$("#nv").innerHTML=[["home","🏠","Accueil"],["map","🗺️","Terrain"],["pl","🌱","Végétaux"],["ac","🧪","Acclim."],["fo","🌳","Forêt"],["mo","☰","Plus"]].map(t=>`<button class="${tab===t[0]?"on":""}" onclick="T('${t[0]}')">${t[1]}<br>${t[2]}</button>`).join("");$("#m").innerHTML={home:vHome,map:vMap,pl:vPl,ac:vAc,fo:vFo,mo:vMo}[tab]();window.scrollTo(0,0)}
function vHome(){const P=S.plants,V=P.filter(p=>!dead(p)),ph=S.obs.filter(o=>o.img).length+P.filter(p=>p.img).length,kg=S.rec.reduce((a,r)=>a+(+r.kg||0),0),al=[];
P.forEach(p=>{if(dead(p))return;const o=pObs(p.id)[0],l=o?o.ts:new Date(p.date||0).getTime();if(Date.now()-l>60*DAY)al.push(p.id+" : aucune observation depuis plus de 60 jours");if(!p.lat)al.push(p.id+" : position GPS manquante")});
if(!S.meta.exp||Date.now()-S.meta.exp>14*DAY)al.unshift("Sauvegarde conseillée : Plus → Données → Télécharger");
const t=(n,l)=>`<div class="tile"><b>${n}</b>${l}</div>`;
return `<div class="grid">${t(S.species.length,"espèces au catalogue")}${t(P.length,"individus plantés")}${t(V.length,"vivants")}${t(P.length?Math.round(V.length/P.length*100)+" %":"—","survie globale")}${t(S.obs.length,"observations")}${t(ph,"photos")}${t(kg.toFixed(1)+" kg","récoltés")}${t(S.assoc.length,"associations notées")}</div>
<div class="row" style="margin-top:12px"><button class="p sp" onclick="plantForm()">🌱 Nouvel arbre</button><button class="sp" onclick="tab='mo';sub='id';draw()">📷 Identifier</button></div>
<h3>À surveiller</h3>${al.length?al.slice(0,8).map(a=>`<div class="card">⚠ ${esc(a)}</div>`).join(""):'<div class="card mu">Rien à signaler.</div>'}
<div class="card"><small>Les données restent sur ce téléphone. Aucune donnée n’est inventée : les résultats d’acclimatation n’apparaissent qu’à partir de vos propres observations.</small></div>`}
function vMap(){const pts=S.plants.filter(p=>p.lat&&p.lng&&(!ZF||p.zone===ZF)),k=Math.cos(REF.lat*Math.PI/180);let la=[REF.lat],lo=[REF.lng];pts.forEach(p=>{la.push(+p.lat);lo.push(+p.lng)});
const a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo),sc=300/Math.max(b-a,(d-c)*k,.0004),X=g=>30+(g-c)*k*sc,Y=g=>330-(g-a)*sc;
const dots=pts.map(p=>`<g onclick="plantSheet('${p.id}')"><circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="11" fill="${dead(p)?"#b3402a":"#1f6b45"}" stroke="#fff" stroke-width="2"/><text x="${X(p.lng)+14}" y="${Y(p.lat)+4}" font-size="11" fill="currentColor">${esc(p.id.replace("AM-",""))}</text></g>`).join("");
return `<select onchange="ZF=this.value;draw()"><option value="">Toutes les zones</option>${ZONES.map(z=>`<option ${z===ZF?"selected":""}>${z}</option>`).join("")}</select>
<div class="card"><b>Plan du terrain</b><br><small>Placé d’après le GPS, nord en haut. Fond satellite non inclus (non disponible hors ligne). + = point de repérage cadastral E-159.</small><svg viewBox="0 0 360 360"><text x="335" y="22" font-size="14" fill="currentColor">N↑</text><path d="M${X(REF.lng)-8} ${Y(REF.lat)}h16M${X(REF.lng)} ${Y(REF.lat)-8}v16" stroke="currentColor" stroke-width="2"/>${dots}</svg><div class="mu">${pts.length} plant(s) · vert = vivant, rouge = mort</div></div>`}
function listSp(){const q=Q.toLowerCase(),L=S.species.filter(s=>(s.sci+s.fr).toLowerCase().includes(q)&&(cat==="all"||(cat==="Q"&&s.sci.startsWith("Quercus"))||(cat==="F"&&s.food)));
return L.map(s=>{const t=stats(s);return `<div class="card" onclick="spForm('${s.id}')"><b><i>${esc(s.sci)}</i></b> <span class="tag">${esc(s.code)}</span>${s.invasive?' <span class="tag r">invasive</span>':""}${s.food?' <span class="tag a">alimentaire</span>':""}<br><small>${esc(s.fam)} · ${esc(s.strate||"strate ?")} · ${S.plants.filter(p=>p.sp===s.id).length} individu(s)${t?" · survie "+Math.round(t.surv*100)+" %":""}</small></div>`}).join("")||'<p class="mu">Aucun résultat.</p>'}
function vPl(){const sg=(v,l)=>`<button class="sp ${vs===v?"on":""}" onclick="vs='${v}';draw()">${l}</button>`;
if(vs==="ind")return `<div class="row">${sg("cat","Catalogue")}${sg("ind","Individus")}</div><button class="p" style="width:100%;margin-top:8px" onclick="plantForm()">＋ Planter</button>`+(S.plants.map(p=>`<div class="card" onclick="plantSheet('${p.id}')"><b>${esc(p.id)}</b> ${dead(p)?'<span class="tag r">mort</span>':'<span class="tag">vivant</span>'}<br><i>${esc(sp(p.sp).sci)}</i><br><small>${esc(p.zone)} · planté le ${esc(p.date||"?")}</small></div>`).join("")||'<p class="mu">Aucun individu.</p>');
const ct=(v,l)=>`<button class="${cat===v?"on":""}" onclick="cat='${v}';draw()">${l}</button>`;
return `<div class="row">${sg("cat","Catalogue")}${sg("ind","Individus")}</div><input placeholder="🔎 Rechercher…" value="${esc(Q)}" oninput="Q=this.value;$('#ls').innerHTML=listSp()"><div class="row">${ct("all","Tout")}${ct("Q","Quercus")}${ct("F","Alimentaires")}<button class="p sp" onclick="spForm()">＋ Espèce</button></div><div id="ls">${listSp()}</div>`}
function vAc(){const rows=S.species.map(s=>[s,stats(s)]).filter(x=>x[1]),zs=[...new Set(S.plants.map(p=>p.zone))];
return `<div class="card"><small><b>Comment lire cette page.</b> Survie = individus vivants / plantés. Confiance : <i>Insuffisant</i> (moins de 3 plants ou moins d’1 an), <i>Préliminaire</i> (≥3 plants, ≥1 an), <i>Indicatif</i> (≥3 ans), <i>Solide</i> (≥5 plants et ≥5 ans). Indice = survie × palier de confiance, affiché seulement dès « Préliminaire ». Une différence entre espèces n’est pas une preuve statistique avec si peu de plants.</small></div>`+
(rows.map(([s,t])=>`<div class="card"><b><i>${esc(s.sci)}</i></b> <span class="tag ${t.lv<2?"a":""}">${t.lab}</span><div class="bar" style="margin:8px 0"><i style="width:${t.surv*100}%"></i></div><small>${t.v}/${t.n} vivants (${Math.round(t.surv*100)} %) · suivi ${t.my.toFixed(1)} an(s)<br>Croissance : ${t.gm==null?"pas assez de mesures":t.gm.toFixed(1)+" cm/an"} · épisodes gel/canicule notés : ${t.st}<br><b>Indice d’acclimatation : ${t.idx==null?"non calculable":t.idx+" / 100"}</b></small></div>`).join("")||'<p class="mu">Plantez des arbres et notez des observations : les résultats apparaîtront ici.</p>')+
(zs.length?`<h3>Par zone</h3>`+zs.map(z=>{const P=S.plants.filter(p=>p.zone===z),v=P.filter(p=>!dead(p)).length;return `<div class="card"><b>${esc(z)}</b><div class="bar" style="margin:6px 0"><i style="width:${v/P.length*100}%"></i></div><small>${v}/${P.length} vivants</small></div>`}).join(""):"")}
function vFo(){const cal=S.species.filter(s=>s.mois);
return `<h3>Strates</h3>`+STR.map(t=>{const L=S.species.filter(s=>s.strate===t);return `<div class="card"><b>${t}</b><br>${L.map(s=>`<span class="tag" onclick="spForm('${s.id}')">${esc(s.sci)}</span>`).join("")||'<small class="mu">Aucune espèce assignée (fiche espèce → strate)</small>'}</div>`}).join("")+
`<h3>Calendrier de récolte</h3><div class="card"><div class="cal"><span></span>${MO.map(m=>`<span>${m}</span>`).join("")}</div>${cal.map(s=>`<div class="cal"><span>${esc(s.sci.split(" ").slice(0,2).join(" "))}</span>${MO.map((_,i)=>`<i class="${s.mois.split(",").includes(String(i+1))?"y":""}"></i>`).join("")}</div>`).join("")||'<small class="mu">Renseignez les mois de récolte dans les fiches espèces.</small>'}</div>
<div class="row"><h3 class="sp">Récoltes</h3><button class="p" onclick="recForm()">＋ Récolte</button></div>${S.rec.slice().reverse().map(r=>`<div class="card"><b>${esc(sp(r.sp).sci||"?")}</b> · ${esc(r.kg)} kg<br><small>${esc(r.date)} ${esc(r.note||"")}</small></div>`).join("")||'<p class="mu">Aucune récolte.</p>'}
<div class="row"><h3 class="sp">Associations</h3><button class="p" onclick="assForm()">＋ Association</button></div>${S.assoc.map(a=>`<div class="card"><b>${esc(sp(a.a).sci)}</b> + <b>${esc(sp(a.b).sci)}</b><br><small>${esc(a.f)} ${esc(a.n||"")}</small></div>`).join("")||'<p class="mu">Aucune association notée.</p>'}`}
function vMo(){const b=(v,l)=>`<button class="sp ${sub===v?"on":""}" onclick="sub='${v}';draw()">${l}</button>`;return `<div class="row">${b("jr","Journal")}${b("id","Identifier")}${b("dt","Données")}</div>`+({jr:vJr,id:vId,dt:vDt}[sub])()}
function vJr(){return [...S.obs].sort((a,b)=>b.ts-a.ts).map(x=>`<div class="card"><span class="tag">${esc(x.type)}</span> <small>${fd(x.ts)}</small><br>${x.plantId?`<b>${esc(x.plantId)}</b> `:""}${esc(x.text)}${x.h?`<br><small>Hauteur ${esc(x.h)} cm</small>`:""}${x.d?`<small> · Ø ${esc(x.d)} cm</small>`:""}${x.lat?`<br><small>📍 ${x.lat}, ${x.lng}</small>`:""}${x.img?`<br><img class="ph" src="${x.img}">`:""}</div>`).join("")||'<p class="mu">Journal vide.</p>'}
function vId(){return `<div class="card"><b>Reconnaissance Pl@ntNet</b><p class="mu">Nécessite Internet et votre clé API gratuite (Plus → Données). Le résultat est une hypothèse à valider.</p><input type="file" id="idf" accept="image/*" capture="environment"><select id="ido"><option value="auto">Organe : automatique</option><option value="leaf">Feuille</option><option value="flower">Fleur</option><option value="fruit">Fruit</option><option value="bark">Écorce</option></select><button class="p" onclick="ident()">Identifier</button><div id="idr" class="mu" style="margin-top:10px"></div></div>`}
function vDt(){return `<div class="card"><b>Sauvegarde</b><p class="mu">Données stockées sur ce téléphone. Téléchargez régulièrement le JSON.</p><button class="p" onclick="exp('json')">Télécharger tout (JSON)</button> <button onclick="exp('csv')">Individus (CSV)</button></div>
<div class="card"><b>Restaurer / importer</b><p class="mu">Accepte aussi le JSON de l’ancienne application « Amelhens ». Fusion sans suppression.</p><input type="file" accept=".json,application/json" onchange="imp(this)"></div>
<div class="card"><b>Clé Pl@ntNet</b><input id="key" placeholder="Collez votre clé API" value="${esc(S.meta.key||"")}"><button onclick="S.meta.key=$('#key').value.trim();save();alert('Clé enregistrée')">Enregistrer</button></div>`}
function dl(n,t,m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function exp(t){const d=new Date().toISOString().slice(0,10);if(t==="json")dl("amelhens-"+d+".json",JSON.stringify(S),"application/json");else dl("individus-"+d+".csv","id;espece;zone;lat;lng;date;fournisseur;lot;vivant\n"+S.plants.map(p=>[p.id,sp(p.sp).sci,p.zone,p.lat,p.lng,p.date,p.sup,p.lot,dead(p)?"non":"oui"].map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\n"),"text/csv");S.meta.exp=Date.now();save()}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);["species","plants","obs","rec","assoc"].forEach(k=>(d[k]||[]).forEach(x=>{if(!S[k].some(y=>y.id===x.id))S[k].push(x)}));save();draw();alert("Import terminé")}catch(e){alert("Fichier invalide")}})}
async function ident(){const f=$("#idf").files[0],k=S.meta.key;if(!f){alert("Choisissez une photo");return}if(!k){alert("Ajoutez d’abord votre clé (Plus → Données)");return}$("#idr").textContent="Analyse…";try{const fm=new FormData();fm.append("images",f);fm.append("organs",$("#ido").value);const r=await fetch("https://my-api.plantnet.org/v2/identify/all?lang=fr&api-key="+encodeURIComponent(k),{method:"POST",body:fm});if(!r.ok)throw new Error("HTTP "+r.status);IDR=(await r.json()).results.slice(0,3);IDI=await rz(f);$("#idr").innerHTML=IDR.map((x,i)=>`<div class="card"><b><i>${esc(x.species.scientificNameWithoutAuthor)}</i></b> · ${Math.round(x.score*100)} %<br><small>${esc((x.species.commonNames||[]).slice(0,2).join(", "))}</small><br><button onclick="idSave(${i})">Noter comme hypothèse</button></div>`).join("")||"Aucun résultat."}catch(e){$("#idr").textContent="Échec : "+e.message+" (réseau, clé ou quota)"}}
function idSave(i){const x=IDR[i];S.obs.push({id:uid(),ts:Date.now(),plantId:"",type:"Identification (hypothèse)",text:"Pl@ntNet propose "+x.species.scientificNameWithoutAuthor+" ("+Math.round(x.score*100)+" %). À valider.",h:"",d:"",lat:"",lng:"",img:IDI||""});save();alert("Ajouté au journal")}
function spForm(id){const s=id?sp(id):{sci:"",fam:"",fr:"",status:"À documenter",source:"",drought:"",frost:"",notes:"",invasive:false,strate:"",mois:"",food:false},sel=(n,v)=>`<select id="${n}"><option value="">non évalué</option>${[0,1,2,3,4,5].map(i=>`<option ${String(v)===String(i)?"selected":""}>${i}</option>`).join("")}</select>`,m=(s.mois||"").split(",");
openS(`<h3>${id?"Fiche espèce":"Nouvelle espèce"}</h3><label>Nom scientifique</label><input id="f1" value="${esc(s.sci)}"><label>Nom français</label><input id="f2" value="${esc(s.fr)}"><label>Famille</label><input id="f3" value="${esc(s.fam)}">
<label>Strate de la forêt nourricière</label><select id="fs"><option value="">—</option>${STR.map(x=>`<option ${x===s.strate?"selected":""}>${x}</option>`).join("")}</select>
<label><input type="checkbox" id="ff" style="width:auto;min-height:0" ${s.food?"checked":""}> Espèce alimentaire</label><p></p><label>Mois de récolte</label><div class="ms">${MO.map((x,i)=>`<label><input type="checkbox" class="mm" value="${i+1}" ${m.includes(String(i+1))?"checked":""}>${x}</label>`).join("")}</div><p></p>
<label>Résistance sécheresse (0-5)</label>${sel("f4",s.drought)}<label>Résistance gel (0-5)</label>${sel("f5",s.frost)}<label>Statut de la donnée</label><select id="f6">${STAT.map(x=>`<option ${x===s.status?"selected":""}>${x}</option>`).join("")}</select><label>Source</label><input id="f7" value="${esc(s.source)}"><label>Notes</label><textarea id="f8" rows="3">${esc(s.notes)}</textarea>
<label><input type="checkbox" id="f9" style="width:auto;min-height:0" ${s.invasive?"checked":""}> Risque invasif avéré (à ne pas recommander)</label><div class="row" style="margin-top:10px"><button class="p sp" onclick="spSave('${id||""}')">Enregistrer</button>${id?`<button onclick="cl();plantForm('${id}')">🌱 Planter</button>`:""}<button onclick="cl()">Annuler</button></div>`)}
function spSave(id){const v=n=>$("#"+n).value.trim();if(!v("f1")){alert("Nom requis");return}let s=id?sp(id):null;if(!s){s={id:uid(),code:mkCode(v("f1"))};S.species.push(s)}
Object.assign(s,{sci:v("f1"),fr:v("f2"),fam:v("f3"),strate:v("fs"),food:$("#ff").checked,mois:[...document.querySelectorAll(".mm:checked")].map(x=>x.value).join(","),drought:v("f4"),frost:v("f5"),status:v("f6"),source:v("f7"),notes:v("f8"),invasive:$("#f9").checked});save();cl();draw()}
function plantForm(spId){PH=null;openS(`<h3>Nouvelle plantation</h3><label>Espèce</label><select id="p1">${S.species.map(s=>`<option value="${s.id}" ${s.id===spId?"selected":""}>${esc(s.sci)}</option>`).join("")}</select><label>Zone expérimentale</label><select id="p2">${ZONES.map(z=>`<option>${z}</option>`).join("")}</select>
<button onclick="gps('#p3','#p4')">📍 Utiliser ma position</button><div class="row"><div class="sp"><label>Latitude</label><input id="p3" inputmode="decimal"></div><div class="sp"><label>Longitude</label><input id="p4" inputmode="decimal"></div></div><label>Date de plantation</label><input type="date" id="p5" value="${new Date().toISOString().slice(0,10)}"><label>Fournisseur / provenance</label><input id="p6"><label>N° de lot</label><input id="p7">${phIn}<div class="row"><button class="p sp" onclick="plantSave()">Créer l’individu</button><button onclick="cl()">Annuler</button></div>`)}
function plantSave(){const s=sp($("#p1").value);let m=S.plants.filter(p=>p.sp===s.id).length+1,id;while(S.plants.some(p=>p.id==="AM-"+s.code+"-"+String(m).padStart(4,"0")))m++;id="AM-"+s.code+"-"+String(m).padStart(4,"0");S.plants.push({id,sp:s.id,zone:$("#p2").value,lat:$("#p3").value,lng:$("#p4").value,date:$("#p5").value,sup:$("#p6").value,lot:$("#p7").value,img:PH||""});save();cl();draw()}
function plantSheet(id){const p=S.plants.find(x=>x.id===id),s=sp(p.sp);openS(`<h3>${esc(p.id)}</h3><p><i>${esc(s.sci)}</i> ${dead(p)?'<span class="tag r">mort</span>':'<span class="tag">vivant</span>'}<br><small>${esc(p.zone)} · planté le ${esc(p.date||"?")}<br>📍 ${esc(p.lat||"?")}, ${esc(p.lng||"?")}<br>Fournisseur : ${esc(p.sup||"—")} · Lot : ${esc(p.lot||"—")}</small></p>${p.img?`<img class="ph" src="${p.img}">`:""}<button class="p" onclick="cl();obsForm('${p.id}')">＋ Observation</button><h4>Historique</h4>${pObs(p.id).map(o=>`<div class="card"><span class="tag">${esc(o.type)}</span> <small>${fd(o.ts)}</small><br>${esc(o.text)}${o.h?` · ${esc(o.h)} cm`:""}${o.img?`<br><img class="ph" src="${o.img}">`:""}</div>`).join("")||'<p class="mu">Aucune observation.</p>'}<button onclick="cl()">Fermer</button>`)}
function obsForm(pid){PH=null;openS(`<h3>Nouvelle observation</h3><label>Végétal (facultatif)</label><select id="o1"><option value="">— général —</option>${S.plants.map(p=>`<option value="${p.id}" ${p.id===pid?"selected":""}>${esc(p.id)} · ${esc(sp(p.sp).sci)}</option>`).join("")}</select><label>Type</label><select id="o2">${OTYPES.map(t=>`<option>${t}</option>`).join("")}</select>${phIn}
<div class="row"><div class="sp"><label>Hauteur (cm)</label><input id="o3" inputmode="decimal"></div><div class="sp"><label>Diamètre tronc (cm)</label><input id="o7" inputmode="decimal"></div></div><label>Note</label><textarea id="o4" rows="3"></textarea><div class="row"><button onclick="mic('#o4')">🎤 Dicter</button><button onclick="gps('#o5','#o6')">📍 Position</button></div><input id="o5" type="hidden"><input id="o6" type="hidden"><div class="row" style="margin-top:10px"><button class="p sp" onclick="obsSave()">Valider</button><button onclick="cl()">Annuler</button></div>`)}
function obsSave(){S.obs.push({id:uid(),ts:Date.now(),plantId:$("#o1").value,type:$("#o2").value,h:$("#o3").value,d:$("#o7").value,text:$("#o4").value.trim(),lat:$("#o5").value,lng:$("#o6").value,img:PH||""});save();cl();draw()}
function recForm(){openS(`<h3>Nouvelle récolte</h3><label>Espèce</label><select id="r1">${S.species.map(s=>`<option value="${s.id}">${esc(s.sci)}</option>`).join("")}</select><label>Quantité (kg)</label><input id="r2" inputmode="decimal"><label>Date</label><input type="date" id="r3" value="${new Date().toISOString().slice(0,10)}"><label>Note (qualité, pertes…)</label><input id="r4"><div class="row"><button class="p sp" onclick="S.rec.push({id:uid(),sp:$('#r1').value,kg:$('#r2').value,date:$('#r3').value,note:$('#r4').value});save();cl();draw()">Enregistrer</button><button onclick="cl()">Annuler</button></div>`)}
function assForm(){const o=S.species.map(s=>`<option value="${s.id}">${esc(s.sci)}</option>`).join("");openS(`<h3>Nouvelle association</h3><label>Espèce A</label><select id="a1">${o}</select><label>Espèce B</label><select id="a2">${o}</select><label>Fonction</label><select id="a3"><option>Ombrage</option><option>Fixation d’azote</option><option>Couvre-sol</option><option>Mellifère</option><option>Protection vent</option><option>Compétition à surveiller</option><option>Autre</option></select><label>Note</label><input id="a4"><div class="row"><button class="p sp" onclick="S.assoc.push({id:uid(),a:$('#a1').value,b:$('#a2').value,f:$('#a3').value,n:$('#a4').value});save();cl();draw()">Enregistrer</button><button onclick="cl()">Annuler</button></div>`)}
const net=()=>{$("#net").textContent=navigator.onLine?"en ligne":"hors ligne"};addEventListener("online",net);addEventListener("offline",net);net();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{S=await load();if(!S)seed();S.rec=S.rec||[];S.assoc=S.assoc||[];S.meta=S.meta||{};if(!S.species.length)seed();save();draw()})();
</script></body></html>
