<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Amelhens</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#123524">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f5f0;--sf:#fff;--tx:#14221a;--mu:#5f6f64;--ac:#1f6b45;--ac2:#e3efe7;--bd:#d6dfd8;--am:#c98a1b;--rd:#b3402a;--sh:0 1px 3px #0001,0 4px 14px #0000000d}
@media(prefers-color-scheme:dark){:root{--bg:#0d1511;--sf:#16211a;--tx:#e6efe8;--mu:#93a599;--ac:#6fcf9a;--ac2:#1d3326;--bd:#27382d;--am:#e0a43a;--rd:#e58a76;--sh:none}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding-bottom:150px}

h1{margin:0;font-size:22px;letter-spacing:.3px}h3{margin:18px 0 6px}small,.mu{color:var(--mu);font-size:13px}header small{color:#cfe8d8}
main{padding:10px 14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:13px;margin:10px 0;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh)}.tile b{font-size:26px;display:block;color:var(--ac)}
button{font:inherit;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}@media(prefers-color-scheme:dark){button.p{color:#0d1511}}
button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:700}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:8px 10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:60px;font-size:11px;padding:0}nav button.on{color:var(--ac);background:var(--ac2)}
#fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;min-height:58px;border-radius:29px;font-size:28px;padding:0;z-index:6;box-shadow:0 4px 14px #0005}
#sh{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}#sh.on{display:flex}
#sc{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:var(--ac2);color:var(--ac);margin:1px}.tag.r{background:#b3402a22;color:var(--rd)}.tag.a{background:#c98a1b22;color:var(--am)}
img.ph{max-width:100%;border-radius:12px;margin:6px 0}svg{width:100%;background:var(--ac2);border-radius:16px}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.cal{display:grid;grid-template-columns:110px repeat(12,1fr);gap:2px;font-size:11px;align-items:center;margin:2px 0}.cal i{height:16px;border-radius:3px;background:var(--bd)}.cal i.y{background:var(--ac)}
.ms{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.ms label{display:flex;gap:3px;align-items:center;font-size:13px}.ms input{width:auto;min-height:0;margin:0}
.tile{position:relative}.pl{position:absolute;top:8px;right:8px;min-height:34px;width:34px;padding:0;border-radius:17px;background:var(--ac2);color:var(--ac);border:0;font-size:20px}.x{min-height:34px;padding:0 10px;float:right;color:var(--rd)}.lt{background:#000a;color:#fff;border:0;box-shadow:none;font-size:11px;padding:1px 5px}#sg div{padding:10px;border:1px solid var(--bd);border-radius:10px;margin:3px 0;background:var(--sf)}</style></head><body>
<header><div class="row"><div class="sp"><h1>🌳 Amelhens</h1><small>Acclimatation · forêt nourricière · terrain</small></div><span id="net" class="tag"></span></div></header>
<main id="m"></main><button id="fab" class="p" onclick="plantForm()" aria-label="Nouvel arbre">＋</button><nav id="nv"></nav>
<div id="sh" onclick="if(event.target===this)cl()"><div id="sc"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const REF={lat:44.181224,lng:4.031918},YR=31557600000,DAY=864e5;
const ZONES=["Plein sud chaud","Sec / faible réserve","Argileux humide l’hiver","Humidité durable","Abrité du vent","Exposé au vent","Risque de gel","Cuvette / poche froide","Ombre partielle","Protégé par végétation","Non définie"];
const OTYPES=["Observation","Mesure","Arrosage","Taille / entretien","Sanitaire","Floraison / fruits","Gel / canicule","Mortalité","Identification (hypothèse)"];
const STAT=["À documenter","Documenté","Estimé","Hypothèse","Observation personnelle"];
const STR=["Grands arbres","Arbres fruitiers","Petits arbres","Arbustes fruitiers","Herbacées","Couvre-sols","Plantes racinaires","Grimpantes","Champignons / mycorhizes"];
const MO="J F M A M J J A S O N D".split(" ");
const QU="pyrenaica,alba,dentata,ithaburensis subsp. macrolepis,coccifera,stellata,libani,muehlenbergii,canariensis,calliprinos,fusiformis,arizonica,frainetto,acutissima,trojana,cerris,pubescens,faginea,canbyi,glaucoides,airensis,buckleyi,franchetii,aucheri,salicina,shumardii,macrocarpa,prinoides,suber,agrifolia,douglasii,brantii".split(",");
const OT=[["Ficus carica","Moraceae"],["Ceratonia siliqua","Fabaceae"],["Pistacia spp.","Anacardiaceae"],["Sapindus mukorossi","Sapindaceae"],["Opuntia spp.","Cactaceae"],["Argania spinosa","Sapotaceae"],["Brachychiton populneus","Malvaceae"],["Quillaja saponaria","Quillajaceae"],["Maytenus boaria","Celastraceae"],["Chilopsis linearis","Bignoniaceae"],["Peumus boldus","Monimiaceae"],["Aesculus californica","Sapindaceae"]];
let S,tab="home",sub="jr",vs="cat",cat="all",Q="",ZF="",PH=null,IDR=[],IDI=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),fd=t=>new Date(t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
const sp=id=>S.species.find(s=>s.id===id)||{},pObs=id=>S.obs.filter(o=>o.plantId===id).sort((a,b)=>b.ts-a.ts),dead=p=>pObs(p.id).some(o=>o.type==="Mortalité"),yrs=p=>p.date?(Date.now()-new Date(p.date))/YR:0;
function mkCode(sci){const p=sci.split(" ");let c=(p[0][0]+(p[1]||"xx").slice(0,2)).toUpperCase(),b=c,n=1;while(S.species.some(s=>s.code===c))c=b+(n++);return c}
function addSp(sci,fam){S.species.push({id:uid(),sci,code:mkCode(sci),fam,fr:"",status:"À documenter",source:"",drought:"",frost:"",invasive:false,notes:"",strate:"",mois:"",food:false})}
function seed(){S={species:[],plants:[],obs:[],rec:[],assoc:[],meta:{}};QU.forEach(e=>addSp("Quercus "+e,"Fagaceae"));OT.forEach(o=>addSp(o[0],o[1]))}
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open("amelhens-pro",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function load(){try{const d=await idb();return await new Promise(r=>{const g=d.transaction("k").objectStore("k").get("s");g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)})}catch(e){return null}}
async function save(){try{const d=await idb();d.transaction("k","readwrite").objectStore("k").put(S,"s")}catch(e){$("#net").textContent="⚠ stockage"}}

const T=t=>{tab=t;draw()};
function rz(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))};im.src=URL.createObjectURL(f)})}

const phIn=`<label>Photo</label><input type="file" accept="image/*" capture="environment" onchange="photo(this)"><div class="mu"></div><div class="mu"></div>`;
function gps(a,b){const x=event.target;x.textContent="Recherche GPS…";navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{$(a).value=p.coords.latitude.toFixed(6);$(b).value=p.coords.longitude.toFixed(6);x.textContent="📍 Position enregistrée"},()=>x.textContent="GPS indisponible",{enableHighAccuracy:true,timeout:20000}):x.textContent="GPS indisponible"}
function mic(id){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert("Dictée non disponible");return}const r=new R();r.lang="fr-FR";r.onresult=e=>{$(id).value+=(" "+e.results[0][0].transcript).trim()+" "};r.start()}
function growth(p){const o=S.obs.filter(x=>x.plantId===p.id&&x.h).sort((a,b)=>a.ts-b.ts);if(o.length<2)return null;const dt=o[o.length-1].ts-o[0].ts;return dt<60*DAY?null:(o[o.length-1].h-o[0].h)/(dt/YR)}
function stats(s){const P=S.plants.filter(p=>p.sp===s.id);if(!P.length)return null;const v=P.filter(p=>!dead(p)).length,my=Math.max(...P.map(yrs)),g=P.map(growth).filter(x=>x!=null),gm=g.length?g.reduce((a,b)=>a+b)/g.length:null,st=S.obs.filter(o=>o.type==="Gel / canicule"&&P.some(p=>p.id===o.plantId)).length;let lv=0;if(P.length>=3&&my>=1)lv=1;if(P.length>=3&&my>=3)lv=2;if(P.length>=5&&my>=5)lv=3;return{n:P.length,v,surv:v/P.length,my,gm,st,lv,lab:["Insuffisant","Préliminaire","Indicatif","Solide"][lv],idx:lv?Math.round(v/P.length*100*[0,.5,.75,1][lv]):null}}
function draw(){navPush();$("#nv").innerHTML=[["home","🏠","Accueil"],["map","🗺️","Terrain"],["pl","🌱","Végétaux"],["ac","🧪","Acclim."],["fo","🌳","Forêt"],["mo","☰","Plus"]].map(t=>`<button class="${tab===t[0]?"on":""}" onclick="T('${t[0]}')">${t[1]}<br>${t[2]}</button>`).join("");$("#m").innerHTML={home:vHome,map:vMap,pl:vPl,ac:vAc,fo:vFo,mo:vMo}[tab]();window.scrollTo(0,0);if(tab==="map")initMap()}
function vHome(){const P=S.plants,V=P.filter(p=>!dead(p)),ph=S.obs.filter(o=>o.img).length+P.filter(p=>p.img).length,kg=S.rec.reduce((a,r)=>a+(+r.kg||0),0),al=[];
P.forEach(p=>{if(dead(p))return;const o=pObs(p.id)[0],l=o?o.ts:new Date(p.date||0).getTime();if(Date.now()-l>60*DAY)al.push(p.id+" : aucune observation depuis plus de 60 jours");if(!p.lat)al.push(p.id+" : position GPS manquante")});
if(!S.meta.exp||Date.now()-S.meta.exp>14*DAY)al.unshift("Sauvegarde conseillée : Plus → Données → Télécharger");const tdy=new Date().toISOString().slice(0,10);S.tasks.filter(k=>k.d&&k.d<tdy).forEach(k=>al.unshift("En retard : "+k.t));if(S.meta.wx&&Math.min(...S.meta.wx.d.temperature_2m_min.slice(7))<=0)al.unshift("Gel annoncé dans les 7 jours : protégez les jeunes plants");
const t=(n,l,a,b)=>`<div class="tile" onclick="${a}">${b?`<button class="pl" onclick="event.stopPropagation();${b}">＋</button>`:""}<b>${n}</b>${l}</div>`;
return `<div class="grid">${t(S.species.length,"espèces au catalogue","tab='pl';vs='cat';draw()","spForm()")}${t(P.length,"individus plantés","tab='pl';vs='ind';draw()","plantForm()")}${t(V.length,"vivants","tab='pl';vs='ind';draw()","")}${t(P.length?Math.round(V.length/P.length*100)+" %":"—","survie globale","T('ac')","")}${t(S.obs.length,"observations","tab='mo';sub='jr';draw()","obsForm()")}${t(ph,"photos","tab='mo';sub='jr';draw()","obsForm()")}${t(kg.toFixed(1)+" kg","récoltés","T('fo')","recForm()")}${t(S.assoc.length,"associations notées","T('fo')","assForm()")}</div>
<div class="row" style="margin-top:12px"><button class="p sp" onclick="plantForm()">🌱 Nouvel arbre</button><button class="sp" onclick="tab='mo';sub='id';draw()">📷 Identifier</button></div>
${wxCard()}${taskCard()}<h3>À surveiller</h3>${al.length?al.slice(0,8).map(a=>`<div class="card">⚠ ${esc(a)}</div>`).join(""):'<div class="card mu">Rien à signaler.</div>'}
<div class="card"><small>Les données restent sur ce téléphone. Aucune donnée n’est inventée : les résultats d’acclimatation n’apparaissent qu’à partir de vos propres observations.</small></div>`}
function vSvg(){const pts=S.plants.filter(p=>p.lat&&p.lng&&(!ZF||p.zone===ZF)),k=Math.cos(REF.lat*Math.PI/180);let la=[REF.lat],lo=[REF.lng];pts.forEach(p=>{la.push(+p.lat);lo.push(+p.lng)});
const a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo),sc=300/Math.max(b-a,(d-c)*k,.0004),X=g=>30+(g-c)*k*sc,Y=g=>330-(g-a)*sc;
const dots=pts.map(p=>`<g onclick="plantSheet('${p.id}')"><circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="11" fill="${dead(p)?"#b3402a":"#1f6b45"}" stroke="#fff" stroke-width="2"/><text x="${X(p.lng)+14}" y="${Y(p.lat)+4}" font-size="11" fill="currentColor">${esc(p.id.replace("AM-",""))}</text></g>`).join("");
return `<select onchange="ZF=this.value;draw()"><option value="">Toutes les zones</option>${ZONES.map(z=>`<option ${z===ZF?"selected":""}>${z}</option>`).join("")}</select>
<div class="card"><b>Plan du terrain</b><br><small>Placé d’après le GPS, nord en haut. Fond satellite non inclus (non disponible hors ligne). + = point de repérage cadastral E-159.</small><svg viewBox="0 0 360 360"><text x="335" y="22" font-size="14" fill="currentColor">N↑</text><path d="M${X(REF.lng)-8} ${Y(REF.lat)}h16M${X(REF.lng)} ${Y(REF.lat)-8}v16" stroke="currentColor" stroke-width="2"/>${dots}</svg><div class="mu">${pts.length} plant(s) · vert = vivant, rouge = mort</div></div>`}
function listSp(){const q=Q.toLowerCase(),L=S.species.filter(s=>(s.sci+s.fr).toLowerCase().includes(q)&&(cat==="all"||(cat==="Q"&&s.sci.startsWith("Quercus"))||(cat==="F"&&s.food)));
return L.map(s=>{const t=stats(s);return `<div class="card" onclick="spForm('${s.id}')"><button class="x" onclick="event.stopPropagation();delSp('${s.id}')">🗑</button><b><i>${esc(s.sci)}</i></b> <span class="tag">${esc(s.code)}</span>${s.invasive?' <span class="tag r">invasive</span>':""}${s.food?' <span class="tag a">alimentaire</span>':""}<br><small>${esc(s.fam)} · ${esc(s.strate||"strate ?")} · ${S.plants.filter(p=>p.sp===s.id).length} individu(s)${t?" · survie "+Math.round(t.surv*100)+" %":""}</small></div>`}).join("")||'<p class="mu">Aucun résultat.</p>'}
function vMap(){return `<div class="row"><select class="sp" id="bs" onchange="setBase(this.value)"><option value="sat">🛰️ Satellite IGN</option><option value="esri">🛰️ Satellite Esri</option><option value="plan">🗺️ Plan</option></select><select class="sp" onchange="ZF=this.value;draw()"><option value="">Toutes zones</option>${ZONES.map(z=>`<option ${z===ZF?"selected":""}>${z}</option>`).join("")}</select></div><div class="row" style="margin-bottom:8px"><button class="p sp" onclick="locate()">📍 Ma position</button><button class="sp" onclick="fitAll()">⛶ Tout voir</button><label class="sp"><input type="checkbox" style="width:auto;min-height:0" onchange="cad(this.checked)"> Cadastre</label></div><div id="map" style="height:58vh;border-radius:16px;overflow:hidden"></div><small class="mu">Touchez la carte pour planter à cet endroit. Fonds : Internet requis ; les zones déjà consultées restent visibles hors ligne.</small>`}
function vPl(){const sg=(v,l)=>`<button class="sp ${vs===v?"on":""}" onclick="vs='${v}';draw()">${l}</button>`;
if(vs==="ind")return `<div class="row">${sg("cat","Catalogue")}${sg("ind","Individus")}</div><button class="p" style="width:100%;margin-top:8px" onclick="plantForm()">＋ Planter</button>`+(S.plants.map(p=>`<div class="card" onclick="plantSheet('${p.id}')"><button class="x" onclick="event.stopPropagation();delPlant('${p.id}')">🗑</button><b>${esc(p.id)}</b> ${dead(p)?'<span class="tag r">mort</span>':'<span class="tag">vivant</span>'}<br><i>${esc(sp(p.sp).sci)}</i><br><small>${esc(p.zone)} · planté le ${esc(p.date||"?")}</small></div>`).join("")||'<p class="mu">Aucun individu.</p>');
const ct=(v,l)=>`<button class="${cat===v?"on":""}" onclick="cat='${v}';draw()">${l}</button>`;
return `<div class="row">${sg("cat","Catalogue")}${sg("ind","Individus")}</div><input placeholder="🔎 Rechercher…" value="${esc(Q)}" oninput="Q=this.value;$('#ls').innerHTML=listSp()"><div class="row">${ct("all","Tout")}${ct("Q","Quercus")}${ct("F","Alimentaires")}<button class="p sp" onclick="spForm()">＋ Espèce</button></div><div id="ls">${listSp()}</div>`}
function vAc(){const rows=S.species.map(s=>[s,stats(s)]).filter(x=>x[1]),zs=[...new Set(S.plants.map(p=>p.zone))];
return `<div class="card"><small><b>Comment lire cette page.</b> Survie = individus vivants / plantés. Confiance : <i>Insuffisant</i> (moins de 3 plants ou moins d’1 an), <i>Préliminaire</i> (≥3 plants, ≥1 an), <i>Indicatif</i> (≥3 ans), <i>Solide</i> (≥5 plants et ≥5 ans). Indice = survie × palier de confiance, affiché seulement dès « Préliminaire ». Une différence entre espèces n’est pas une preuve statistique avec si peu de plants.</small></div>`+
(rows.map(([s,t])=>`<div class="card"><b><i>${esc(s.sci)}</i></b> <span class="tag ${t.lv<2?"a":""}">${t.lab}</span><div class="bar" style="margin:8px 0"><i style="width:${t.surv*100}%"></i></div><small>${t.v}/${t.n} vivants (${Math.round(t.surv*100)} %) · suivi ${t.my.toFixed(1)} an(s)<br>Croissance : ${t.gm==null?"pas assez de mesures":t.gm.toFixed(1)+" cm/an"} · épisodes gel/canicule notés : ${t.st}<br><b>Indice d’acclimatation : ${t.idx==null?"non calculable":t.idx+" / 100"}</b></small></div>`).join("")||'<p class="mu">Plantez des arbres et notez des observations : les résultats apparaîtront ici.</p>')+
(zs.length?`<h3>Par zone</h3>`+zs.map(z=>{const P=S.plants.filter(p=>p.zone===z),v=P.filter(p=>!dead(p)).length;return `<div class="card"><b>${esc(z)}</b><div class="bar" style="margin:6px 0"><i style="width:${v/P.length*100}%"></i></div><small>${v}/${P.length} vivants</small></div>`}).join(""):"")}
function vFo(){const cal=S.species.filter(s=>s.mois);
return `<h3>Strates</h3>`+STR.map(t=>{const L=S.species.filter(s=>s.strate===t);return `<div class="card"><b>${t}</b><br>${L.map(s=>`<span class="tag" onclick="spForm('${s.id}')">${esc(s.sci)}</span>`).join("")||'<small class="mu">Aucune espèce assignée (fiche espèce → strate)</small>'}</div>`}).join("")+
`<h3>Calendrier de récolte</h3><div class="card"><div class="cal"><span></span>${MO.map(m=>`<span>${m}</span>`).join("")}</div>${cal.map(s=>`<div class="cal"><span>${esc(s.sci.split(" ").slice(0,2).join(" "))}</span>${MO.map((_,i)=>`<i class="${s.mois.split(",").includes(String(i+1))?"y":""}"></i>`).join("")}</div>`).join("")||'<small class="mu">Renseignez les mois de récolte dans les fiches espèces.</small>'}</div>
<div class="row"><h3 class="sp">Récoltes</h3><button class="p" onclick="recForm()">＋ Récolte</button></div>${S.rec.slice().reverse().map(r=>`<div class="card"><b>${esc(sp(r.sp).sci||"?")}</b> · ${esc(r.kg)} kg<br><small>${esc(r.date)} ${esc(r.note||"")}</small></div>`).join("")||'<p class="mu">Aucune récolte.</p>'}

function parse(rows){rows=rows.map(r=>r.map(c=>String(c??"").trim())).filter(r=>r.some(c=>c));if(!rows.length)return[];let ci=0,cf=-1,cn=-1;const h=rows[0].map(c=>c.toLowerCase());
if(h.some(c=>/scient|latin|esp[eè]ce|species|^nom/.test(c))){rows.shift();h.forEach((c,i)=>{if(/scient|latin|species/.test(c))ci=i;else if(/famil/.test(c))cf=i;else if(/fran[cç]ais|vernac|commun/.test(c))cn=i});if(!h.some(c=>/scient|latin|species/.test(c))){const k=h.findIndex(c=>/esp[eè]ce|^nom/.test(c));if(k>=0)ci=k}}else{cf=rows[0].length>1?1:-1;cn=rows[0].length>2?2:-1}
return rows.map(r=>({sci:r[ci]||"",fam:cf>=0?r[cf]||"":"",fr:cn>=0?r[cn]||"":""})).filter(x=>x.sci)}
function addList(it){let n=0,d=0;it.forEach(x=>{const sci=x.sci.replace(/\s+/g," ").trim();if(!sci)return;if(S.species.some(s=>s.sci.toLowerCase()===sci.toLowerCase())){d++;return}addSp(sci,x.fam);S.species[S.species.length-1].fr=x.fr;n++});save();draw();alert(n+" espèce(s) ajoutée(s), "+d+" déjà présente(s).")}
async function impFile(i){const f=i.files[0];if(!f)return;try{let rows;if(/\.(csv|txt)$/i.test(f.name))rows=(await f.text()).split(/\r?\n/).map(l=>l.split(/[;,\t]/));else{if(!window.XLSX)await ls("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");const wb=XLSX.read(await f.arrayBuffer());rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1})}addList(parse(rows))}catch(e){alert("Lecture impossible : "+e.message+". Essayez un fichier CSV ou vérifiez Internet.")}}
async function complete(){const L2=S.species.filter(s=>!s.fam||!s.fr||!s.source),o=$("#cp");let i=0,ok=0;for(const s of L2){i++;o.textContent="Analyse "+i+"/"+L2.length+" : "+s.sci;try{const m=await(await fetch("https://api.gbif.org/v1/species/match?kingdom=Plantae&name="+encodeURIComponent(s.sci))).json();if(m.usageKey&&m.matchType!=="NONE"){if(!s.fam&&m.family)s.fam=m.family;if(!s.fr&&m.matchType==="EXACT")s.fr=await fr(m.usageKey);if(m.status==="SYNONYM"&&m.species)s.notes=(s.notes?s.notes+" ":"")+"[GBIF : synonyme, nom accepté "+m.species+"]";if(!s.source)s.source="Taxonomie : GBIF "+new Date().toISOString().slice(0,10);ok++}}catch(e){o.textContent="Connexion interrompue ("+i+"/"+L2.length+"). Réessayez.";save();return}if(i%10===0)save()}save();draw();alert(ok+" fiche(s) complétée(s) sur "+L2.length+".")}
function vLi(){return `<div class="card"><b>Coller une liste de noms</b><p class="mu">Un nom scientifique par ligne. Famille et nom français facultatifs, séparés par « ; » ou une virgule.</p><textarea id="ll" rows="6" placeholder="Quercus robur&#10;Ficus carica; Moraceae; Figuier"></textarea><button class="p" onclick="addList(parse($('#ll').value.split('\\n').map(l=>l.split(/[;,\\t]/))))">Ajouter à la base</button></div>
<div class="card"><b>Importer un tableur</b><p class="mu">Fichier .ods, .xlsx ou .csv. Colonnes reconnues : nom scientifique, famille, nom français (avec ou sans ligne d’en-tête). Pour .ods et .xlsx, Internet est nécessaire.</p><input type="file" accept=".ods,.xlsx,.xls,.csv,.txt" onchange="impFile(this)"></div>
<div class="card"><b>Compléter automatiquement</b><p class="mu">Cherche la famille botanique et le nom français de chaque espèce dans GBIF (base scientifique ouverte). Les données écologiques (gel, sécheresse…) ne sont jamais inventées : à renseigner avec vos sources.</p><button class="p" onclick="complete()">Compléter la base</button><div id="cp" class="mu" style="margin-top:8px"></div></div>`}
/* ===== v3 : météo, rappels ===== */
async function wx(){try{const j=await(await fetch("https://api.open-meteo.com/v1/forecast?latitude="+REF.lat+"&longitude="+REF.lng+"&daily=temperature_2m_min,temperature_2m_max,precipitation_sum&forecast_days=7&past_days=7&timezone=auto")).json();if(j.daily){S.meta.wx={t:Date.now(),d:j.daily};save();if(tab==="home")draw()}}catch(e){}}
function wxCard(){const w=S.meta.wx;if(!w)return '<div class="card"><small>🌦 Météo du terrain : connexion Internet requise.</small></div>';const d=w.d,i0=7,mn=d.temperature_2m_min.slice(i0),mx=d.temperature_2m_max.slice(i0),pr=d.precipitation_sum.slice(i0);let dry=0;for(let i=i0;i>=0&&d.precipitation_sum[i]<1;i--)dry++;const fm=Math.min(...mn);
return `<div class="card"><b>🌦 Météo au terrain</b> <small>Open-Meteo · ${fd(w.t)}</small><br>${fm<=0?`<span class="tag ${fm<=-5?"r":"a"}">❄ Gel annoncé : ${Math.round(fm)} °C</span>`:""}${Math.max(...mx)>=35?'<span class="tag r">🔥 35 °C ou plus annoncé</span>':""}<div class="row" style="margin:8px 0;justify-content:space-between">${d.time.slice(i0).map((t,i)=>`<div style="text-align:center;font-size:12px"><div>${new Date(t).toLocaleDateString("fr-FR",{weekday:"short"})}</div><b>${Math.round(mx[i])}°</b><div class="mu">${Math.round(mn[i])}°</div><div>${pr[i]>=1?Math.round(pr[i])+" mm":"–"}</div></div>`).join("")}</div><small>${dry} jour(s) sans pluie significative (moins de 1 mm). Prévision à 1 point, pas une mesure sur site.</small></div>`}
function taskCard(){const T2=[...S.tasks].sort((a,b)=>(a.d||"").localeCompare(b.d||"")),td=new Date().toISOString().slice(0,10);return `<div class="row"><h3 class="sp">Rappels</h3><button class="p" onclick="taskForm()">＋</button></div>`+(T2.map(k=>`<div class="card row"><div class="sp"><b>${esc(k.t)}</b><br><small>${esc(k.d||"")} ${esc(k.p||"")}</small> ${k.d&&k.d<td?'<span class="tag r">en retard</span>':""}</div><button onclick="taskDone('${k.id}')">✓ Fait</button></div>`).join("")||'<div class="card mu"><small>Aucun rappel. Touchez ＋ pour en créer.</small></div>')}
function taskForm(){openS(`<h3>Nouveau rappel</h3><label>À faire</label><input id="k1" placeholder="Arroser, tailler, mesurer…"><label>Date</label><input type="date" id="k2" value="${new Date().toISOString().slice(0,10)}"><label>Arbre (facultatif)</label><select id="k3"><option value="">—</option>${S.plants.map(p=>`<option value="${p.id}">${esc(p.id)}</option>`).join("")}</select><div class="row"><button class="p sp" onclick="if($('#k1').value.trim()){S.tasks.push({id:uid(),t:$('#k1').value.trim(),d:$('#k2').value,p:$('#k3').value});save();cl();draw()}">Enregistrer</button><button onclick="cl()">Annuler</button></div>`)}
function taskDone(id){const k=S.tasks.find(x=>x.id===id);if(!k)return;S.obs.push({id:uid(),ts:Date.now(),plantId:k.p||"",type:"Taille / entretien",text:"Fait : "+k.t,h:"",d:"",lat:"",lng:"",img:""});S.tasks=S.tasks.filter(x=>x.id!==id);save();draw()}
/* ===== v4 : retour Android, nouvel arbre assisté, export tableur, vérif photo ===== */
let HIST=[],CUR=null,BK=0,SHP=0;const XL="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",sOn=()=>$("#sh").classList.contains("on");
function navPush(){const n={tab,sub,vs};if(!CUR){CUR=n;return}if(CUR.tab!==tab||CUR.sub!==sub||CUR.vs!==vs){HIST.push(CUR);history.pushState({n:1},"");CUR=n}}
addEventListener("popstate",()=>{if(BK){BK=0;return}if(sOn()){SHP=0;$("#sh").classList.remove("on");return}if(HIST.length){const p=HIST.pop();tab=p.tab;sub=p.sub;vs=p.vs;CUR=p;draw()}});
function openS(h){$("#sc").innerHTML=h;$("#sh").classList.add("on");if(!SHP){history.pushState({sh:1},"");SHP=1}}
function cl(){$("#sh").classList.remove("on");setTimeout(()=>{if(SHP&&!sOn()){BK=1;SHP=0;history.back()}},0)}
async function comp1(s){try{const m=await(await fetch("https://api.gbif.org/v1/species/match?kingdom=Plantae&name="+encodeURIComponent(s.sci))).json();if(m.usageKey&&m.matchType!=="NONE"){if(!s.fam&&m.family)s.fam=m.family;if(!s.fr&&m.matchType==="EXACT")s.fr=await fr(m.usageKey);if(!s.source)s.source="Taxonomie : GBIF "+new Date().toISOString().slice(0,10);save()}}catch(e){}}
function sum(s){const o=$("#psum");if(o)o.innerHTML=`<div class="card"><b><i>${esc(s.sci)}</i></b> <span class="tag">${esc(s.code)}</span><br><small>${esc(s.fam||"famille à compléter")} · ${esc(s.fr||"nom français à compléter")}${s.strate?" · "+esc(s.strate):""}</small></div>`}
function plPick(id){const s=sp(id);$("#p1").value=id;$("#pn").value=s.sci;$("#sg2").innerHTML="";sum(s);if((!s.fam||!s.fr)&&navigator.onLine)comp1(s).then(()=>{if($("#p1")&&$("#p1").value===id)sum(s)})}
async function plAdd(k,n,f){addSp(n,f);const s=S.species[S.species.length-1];s.source="Taxonomie : GBIF "+new Date().toISOString().slice(0,10);save();plPick(s.id);s.fr=await fr(k)||s.fr;save();if($("#p1")&&$("#p1").value===s.id)sum(s)}
function plNew(n){addSp(n,"");save();plPick(S.species[S.species.length-1].id)}
function plSugg(q){clearTimeout(ST);const b=$("#sg2");$("#p1").value="";$("#psum").innerHTML="";if(q.length<2){b.innerHTML="";return}const ql=q.toLowerCase(),q2=esc(q.replace(/'/g,"")),mk=()=>`<div onclick="plNew('${q2}')">＋ Créer « ${q2} » (fiche libre)</div>`;
b.innerHTML=S.species.filter(s=>(s.sci+" "+s.fr).toLowerCase().includes(ql)).slice(0,5).map(s=>`<div onclick="plPick('${s.id}')"><i>${esc(s.sci)}</i> <small>catalogue · ${esc(s.fr||s.fam)}</small></div>`).join("")+mk();
if(q.length<3||!navigator.onLine)return;ST=setTimeout(async()=>{try{const j=await(await fetch("https://api.gbif.org/v1/species/suggest?q="+encodeURIComponent(q)+"&rank=SPECIES&highertaxonKey=6&limit=6")).json();if($("#pn").value!==q)return;b.innerHTML=b.innerHTML.replace(mk(),"")+j.filter(x=>!S.species.some(s=>s.sci.toLowerCase()===(x.canonicalName||"").toLowerCase())).map(x=>`<div onclick="plAdd(${x.key},'${esc((x.canonicalName||"").replace(/'/g,""))}','${esc((x.family||"").replace(/'/g,""))}')"><i>${esc(x.canonicalName||x.scientificName)}</i> <small>ajouter · ${esc(x.family||"")}</small></div>`).join("")+mk()}catch(e){}},350)}
async function photo(i){const f=i.files[0];if(!f)return;PH=await rz(f);const o=i.nextElementSibling;o.textContent="✔ Photo prête";const pl=$("#o1")&&$("#o1").value?S.plants.find(p=>p.id===$("#o1").value):null,sc=($("#p1")&&sp($("#p1").value).sci)||(pl&&sp(pl.sp).sci);if(sc&&S.meta.key&&navigator.onLine)verify(f,sc,o.nextElementSibling);else if(sc&&!S.meta.key)o.nextElementSibling.textContent="Vérification du nom : ajoutez votre clé Pl@ntNet (Plus → Données)."}
async function verify(f,sc,out){out.textContent="Vérification du nom…";try{const fm=new FormData();fm.append("images",f);fm.append("organs","auto");const j=await(await fetch("https://my-api.plantnet.org/v2/identify/all?lang=fr&api-key="+encodeURIComponent(S.meta.key),{method:"POST",body:fm})).json(),r=j.results.slice(0,3),w=sc.toLowerCase().split(" "),nm=x=>x.species.scientificNameWithoutAuthor.toLowerCase(),ex=r.find(x=>nm(x).startsWith(w[0]+" "+(w[1]||""))),ge=r.find(x=>nm(x).startsWith(w[0]+" "));out.innerHTML=ex?`✅ Compatible avec <i>${esc(sc)}</i> (${Math.round(ex.score*100)} %). Hypothèse automatique.`:ge?`🟡 Même genre (<i>${esc(ge.species.scientificNameWithoutAuthor)}</i>, ${Math.round(ge.score*100)} %) : espèce à confirmer.`:`⚠ Pl@ntNet propose plutôt <i>${esc(r[0].species.scientificNameWithoutAuthor)}</i> (${Math.round(r[0].score*100)} %). À vérifier.`}catch(e){out.textContent="Vérification indisponible ("+e.message+")."}}
async function xport(kind){const f=$("#xf").value;let rows;if(kind==="sp")rows=[["Nom scientifique","Famille","Nom français","Code","Strate","Alimentaire","Mois de récolte","Résistance sécheresse","Résistance gel","Statut","Source","Notes"],...S.species.map(s=>[s.sci,s.fam,s.fr,s.code,s.strate,s.food?"oui":"",s.mois,s.drought,s.frost,s.status,s.source,s.notes])];else if(kind==="pl")rows=[["Identifiant","Espèce","Zone","Latitude","Longitude","Date de plantation","Fournisseur","Lot","Vivant"],...S.plants.map(p=>[p.id,sp(p.sp).sci,p.zone,p.lat,p.lng,p.date,p.sup,p.lot,dead(p)?"non":"oui"])];else rows=[["Date","Arbre","Type","Note","Hauteur (cm)","Diamètre (cm)"],...S.obs.map(o=>[fd(o.ts),o.plantId,o.type,o.text,o.h,o.d])];
const nm="amelhens-"+kind+"-"+new Date().toISOString().slice(0,10);if(f==="csv"){dl(nm+".csv","\ufeff"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\n"),"text/csv");return}
try{if(!window.XLSX)await ls(XL);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Amelhens");dl(nm+"."+f,XLSX.write(wb,{bookType:f,type:"array"}),"application/octet-stream")}catch(e){alert("ODS et XLSX demandent Internet la première fois. Essayez CSV. ("+e.message+")")}}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{S=await load();if(!S)seed();S.rec=S.rec||[];S.tasks=S.tasks||[];S.assoc=S.assoc||[];S.meta=S.meta||{};if(!S.species.length)seed();save();draw();if(navigator.onLine&&(!S.meta.wx||Date.now()-S.meta.wx.t>3*36e5))wx()})();
</script></body></html>
